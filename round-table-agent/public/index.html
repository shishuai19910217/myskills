<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>多模型圆桌勘探 Agent</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --line:#262b36; --txt:#e6e9ef; --dim:#8b93a5; --acc:#4f8cff; --ok:#3fbf7f; --warn:#f0c674; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Segoe UI", "Microsoft YaHei", sans-serif; background:var(--bg); color:var(--txt); }
  header { display:flex; gap:12px; align-items:center; padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  header .meta { font-size:12px; color:var(--dim); }
  main { max-width:1000px; margin:0 auto; padding:16px; }
  textarea { width:100%; min-height:90px; background:#0c0e12; color:var(--txt); border:1px solid var(--line); border-radius:8px; padding:10px; font-size:14px; resize:vertical; }
  .row { display:flex; gap:8px; margin-top:8px; align-items:center; flex-wrap:wrap; }
  button { background:#232936; color:var(--txt); border:1px solid var(--line); border-radius:6px; padding:6px 14px; cursor:pointer; font-size:13px; }
  button:hover { border-color:var(--acc); }
  button.primary { background:var(--acc); color:#fff; border-color:var(--acc); }
  button.danger { color:#ff7b7b; border-color:#5a3a3a; }
  button:disabled { opacity:.4; cursor:not-allowed; }
  select { background:#0c0e12; color:var(--txt); border:1px solid var(--line); border-radius:6px; padding:6px 8px; font-size:13px; }
  #transcript { margin-top:16px; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; min-height:200px; font-size:14px; line-height:1.7; }
  .ev { margin:6px 0; padding:6px 10px; border-left:3px solid var(--line); border-radius:4px; white-space:normal; word-break:break-word; }
  .ev.opening { border-color:var(--acc); }
  .ev.question { border-color:#b07bf0; }
  .ev.reply { border-color:#8b93a5; margin-left:18px; white-space:pre-wrap; }
  .ev.boundary { border-color:var(--ok); }
  .ev.round, .ev.converged { color:var(--dim); font-size:13px; }
  .ev.converged { color:var(--warn); }
  .ev.list, .ev.final { border-color:var(--warn); background:#1c1a12; white-space:normal; }
  .ev.final { white-space:pre-wrap; }
  .ev.user { border-color:var(--acc); background:#16203a; }
  .ev.error { border-color:#ff7b7b; color:#ff9b9b; }
  .ev.notice { border-color:var(--warn); color:var(--warn); font-size:13px; }
  .ev.notice-info { border-color:var(--acc); color:#9db8e8; font-size:13px; }
  .tag { font-size:11px; padding:1px 7px; border-radius:9px; background:#262b36; margin-right:6px; color:var(--dim); }
  .tag.q { color:#b07bf0; } .tag.r { color:#e6e9ef; } .tag.b { color:var(--ok); } .tag.u { color:var(--warn); }
  #boundaryList { display:none; margin-top:16px; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; }
  .list-head { display:flex; flex-wrap:wrap; align-items:baseline; gap:6px; font-size:13px; margin-bottom:10px; }
  .list-head b { font-size:14px; }
  .list-head .stats { color:var(--dim); font-size:12px; }
  .tbl-wrap { overflow-x:auto; }
  table.bt { border-collapse:collapse; width:100%; font-size:13px; }
  table.bt th, table.bt td { border:1px solid var(--line); padding:6px 10px; text-align:left; vertical-align:top; line-height:1.55; }
  table.bt th { background:#14171f; color:var(--dim); font-weight:600; font-size:12px; white-space:nowrap; position:sticky; top:0; }
  table.bt td.desc { min-width:260px; }
  table.bt tr.is-rejected td { color:var(--dim); }
  table.bt tr.is-rejected td.desc { text-decoration:line-through; }
  table.bt tr.is-merged td.desc { color:var(--dim); }
  .type-pill { font-size:11px; padding:1px 8px; border-radius:9px; white-space:nowrap; }
  .type-目标 { background:#16233a; color:#7fb0ff; }
  .type-约束 { background:#1d2b1e; color:#8bd49c; }
  .type-反例 { background:#3a2020; color:#ff9b9b; }
  .type-前提 { background:#2c2438; color:#c39bf0; }
  .type-盲区 { background:#33301d; color:var(--warn); }
  .conf { font-size:11px; padding:1px 7px; border-radius:9px; white-space:nowrap; }
  .conf.high { background:#1d2b1e; color:#8bd49c; }
  .conf.medium { background:#33301d; color:var(--warn); }
  .conf.low { background:#2a2d36; color:var(--dim); }
  .cell-id { color:var(--dim); font-size:12px; white-space:nowrap; }
  .cell-src { color:var(--dim); font-size:12px; white-space:nowrap; }
  .cell-status { font-size:12px; white-space:nowrap; }
  .cell-status.merged { color:var(--warn); }
  .cell-status.rejected { color:#ff9b9b; }
  .empty-row { color:var(--dim); text-align:center; }
  .md h1, .md h2, .md h3 { margin:14px 0 6px; line-height:1.4; }
  .md h1 { font-size:17px; }
  .md h2 { font-size:15px; color:var(--warn); border-bottom:1px solid var(--line); padding-bottom:4px; }
  .md h3 { font-size:14px; color:#cfd6e4; }
  .md > :first-child { margin-top:0; }
  .md ul, .md ol { margin:6px 0; padding-left:22px; }
  .md li { margin:3px 0; }
  .md p { margin:6px 0; }
  .md blockquote { margin:6px 0; padding:2px 10px; border-left:3px solid var(--line); color:var(--dim); }
  .md code { background:#14171f; border:1px solid var(--line); border-radius:4px; padding:0 4px; font-size:12px; }
  .md table { border-collapse:collapse; margin:8px 0; font-size:13px; }
  .md th, .md td { border:1px solid var(--line); padding:5px 10px; }
  .md th { background:#14171f; color:var(--dim); }
  .mini-btn:disabled { opacity:.5; cursor:not-allowed; }
  #controls { margin-top:14px; display:none; }
  .hint { font-size:12px; color:var(--dim); margin-top:6px; }
  .cursor { display:inline-block; width:7px; background:var(--dim); animation:blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity:0; } }
  /* 模型配置弹窗 */
  .modal-mask { position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:center; justify-content:center; z-index:20; }
  .modal-mask.show { display:flex; }
  .modal { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:18px; width:760px; max-width:92vw; max-height:88vh; overflow:auto; }
  .modal h2 { font-size:15px; margin:0 0 4px; }
  .modal h3 { font-size:13px; margin:14px 0 6px; display:flex; align-items:center; gap:8px; }
  .modal .sub { font-size:12px; color:var(--dim); margin-bottom:12px; }
  .seat-row { display:grid; grid-template-columns:140px 1fr 1fr; gap:8px; align-items:center; margin:8px 0; }
  .seat-row .seat-name { font-size:13px; }
  .seat-row .seat-name small { display:block; color:var(--dim); font-size:11px; }
  .modal input, .modal select { width:100%; background:#0c0e12; color:var(--txt); border:1px solid var(--line); border-radius:6px; padding:6px 8px; font-size:13px; box-sizing:border-box; }
  .modal .actions { display:flex; gap:8px; justify-content:flex-end; margin-top:14px; }
  #cfgMsg { font-size:12px; margin-top:8px; min-height:16px; }
  .provider-card { border:1px solid var(--line); border-radius:8px; padding:10px; margin:8px 0; }
  .provider-card .pc-head { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .provider-card .pc-head input { flex:1; }
  .provider-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .field { display:flex; flex-direction:column; gap:3px; }
  .field label { font-size:11px; color:var(--dim); }
  .key-hint { font-size:11px; color:var(--ok); }
  .key-hint.missing { color:#e0a458; }
  #cfgWarn { font-size:12px; color:#e0a458; margin-top:8px; min-height:14px; }
  .pc-del { background:none; border:1px solid var(--line); color:#ff9b9b; border-radius:6px; padding:4px 10px; cursor:pointer; font-size:12px; }
  .mini-btn { background:none; border:1px dashed var(--line); color:var(--dim); border-radius:6px; padding:5px 12px; cursor:pointer; font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>多模型圆桌勘探 Agent</h1>
  <span class="meta" id="meta">未开始</span>
  <span style="flex:1"></span>
  <button id="cfgBtn">模型配置</button>
  <button id="listToggle" disabled>只看清单</button>
  <button id="downloadBtn" disabled>下载 MD 报告</button>
  <button id="finalizeBtn" class="primary" disabled>出最终方案</button>
  <button id="cleanFilesBtn" class="danger" title="清理 data/meetings/ 下的历史快照与报告文件">清理历史文件</button>
</header>

<main>
  <textarea id="input" placeholder="输入一个边界不清晰的问题，例如：小说AI味表现哪些方面"></textarea>
  <div class="row">
    <button id="startBtn" class="primary">开始圆桌会议</button>
    <span class="hint">多模型分角色勘探 → 产出边界约束清单 → 可补充循环 → 最终方案</span>
  </div>

  <div id="controls">
    <textarea id="interject" placeholder="勘探中或收敛后均可插话：补充说明 / 追加一条边界 / 停止勘探"></textarea>
    <div class="row">
      <select id="turnKind">
        <option value="auto">自动判断类型</option>
        <option value="supplement">补充说明</option>
        <option value="new_boundary">追加边界</option>
        <option value="stop">停止勘探</option>
      </select>
      <select id="boundaryType" style="display:none">
        <option>盲区</option>
        <option>目标</option>
        <option>约束</option>
        <option>反例</option>
        <option>前提</option>
      </select>
      <button id="sendTurn">发送</button>
      <button id="stopBtn" class="danger">停止勘探</button>
    </div>
    <div class="hint">选择"追加边界"时需指定类别；其余情况可交给统筹者自动判断，无法判断时会请你澄清。</div>
  </div>

  <div id="transcript"></div>
  <div id="boundaryList">
    <div class="list-head">
      <b>边界约束清单</b>
      <span class="stats" id="listStats"></span>
      <span style="flex:1"></span>
      <button class="mini-btn" id="listDownloadBtn" disabled>下载清单 MD</button>
    </div>
    <div class="tbl-wrap">
      <table class="bt">
        <thead>
          <tr>
            <th style="width:56px">编号</th>
            <th style="width:64px">类别</th>
            <th>边界描述</th>
            <th style="width:60px">可信度</th>
            <th style="width:150px">来源</th>
            <th style="width:52px">轮次</th>
            <th style="width:120px">裁决状态</th>
          </tr>
        </thead>
        <tbody id="listBody"></tbody>
      </table>
    </div>
  </div>
</main>

<div class="modal-mask" id="cfgMask">
  <div class="modal">
    <h2>模型配置</h2>
    <div class="sub">配置 OpenAI 兼容接口的接入信息（baseURL / 模型 / API Key），再为各席位选择供应商。保存后写回本地 providers.json，对新开始的会议生效。</div>

    <h3>供应商接入 <button class="mini-btn" id="cfgAddProvider" type="button">+ 新增供应商</button></h3>
    <div id="cfgProviders"></div>

    <h3>席位绑定</h3>
    <div class="seat-row" style="color:var(--dim); font-size:12px;">
      <span>席位</span><span>供应商</span><span>模型（留空=供应商默认）</span>
    </div>
    <div id="cfgSeats"></div>
    <div id="cfgWarn"></div>
    <div id="cfgMsg"></div>
    <div class="actions">
      <button id="cfgCancel">取消</button>
      <button id="cfgSave" class="primary">保存</button>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let meetingId = null;
let es = null;
let listOnly = false;
let running = false;
/** 当前流式发言块：key = round + '|' + seat */
const streaming = new Map();

const CONF_LABEL = { high: "高", medium: "中", low: "低" };
const CONVERGE_LABEL = { auto: "自动收敛", user_stop: "用户停止", max_rounds: "达到最大轮次" };
const KIND_LABEL = { new_boundary: "追加边界", supplement: "补充说明", stop: "停止", other: "未识别" };
const GOAL_LABEL = { enumerate: "枚举清单", judge: "判断", design: "方案设计", diagnose: "诊断", other: "其他" };

/** 统计汉字数量，用于识别英文思考链式输出 */
function cjkCount(s) {
  return (s.match(/[一-鿿]/g) || []).length;
}

/** 取首个长度足够的完整中文句子 */
function firstChineseSentence(s) {
  const m = /[一-鿿][\s\S]{8,}?[。！？…”」』]/.exec(s);
  return m && m[0].trim().length >= 10 ? m[0].trim() : "";
}

/** 思考链末尾常见的 Description: "..." / 描述：「...」标注答案：取最后一个标注之后的内容 */
function salvageLabeled(raw) {
  const labels = [...raw.matchAll(/description|描述|边界描述/gi)];
  for (let k = labels.length - 1; k >= 0; k--) {
    const tail = raw.slice(labels[k].index + labels[k][0].length);
    const m = /^\s*[：:]\s*["“']?\s*([\s\S]*)$/.exec(tail);
    if (!m) continue;
    const sentence = firstChineseSentence(m[1]);
    if (sentence) return sentence;
    const rest = m[1].trim();
    if (cjkCount(rest) >= 10) return rest.replace(/\s+/g, " ").slice(0, 500);
  }
  return "";
}

/**
 * 协议 JSON 提取失败时的前端挽救：
 * ① 思考链末尾的 Description:/描述：标注答案；② 以中文为主的纯文本正文（英文思考链不展示）。
 */
function salvageText(raw) {
  const s = String(raw ?? "");
  const labeled = salvageLabeled(s);
  if (labeled) return labeled;
  const prose = s.replace(/```(?:json)?/gi, "").trim();
  if (!prose || prose.startsWith("{")) return "";
  const cjk = cjkCount(prose);
  return cjk >= 10 && cjk / prose.length >= 0.3 ? prose.slice(0, 500) : "";
}

/**
 * 从席位原始输出中提取 description 明文（输出协议为 {"description":"...","confidence":"..."}）。
 * 与后端 scanDescriptionPrefix 同构：闭合返回全文；未闭合（多为 maxTokens 截断）返回已解码残片。
 */
function extractDescription(raw) {
  const s = String(raw ?? "");
  const start = s.indexOf("{");
  if (start === -1) return "";
  const m = new RegExp('\\{\\s*"description"\\s*:\\s*"', "y");
  m.lastIndex = start;
  if (!m.test(s)) return "";
  let val = "";
  for (let i = m.lastIndex; i < s.length; i++) {
    const ch = s[i];
    if (ch === '"') return val; // 字段闭合（含空字符串，交调用方兜底）
    if (ch === "\\") {
      const next = s[i + 1];
      if (next === undefined) break; // 转义符刚生成：按残片处理
      if (next === "u") {
        const hex = s.slice(i + 2, i + 6);
        if (!/^[0-9a-fA-F]{4}$/.test(hex)) break;
        val += JSON.parse(`"\\u${hex}"`);
        i += 5;
      } else {
        val += JSON.parse(`"\\${next}"`);
        i += 1;
      }
    } else {
      val += ch;
    }
  }
  // 未闭合残片：与后端 parseSeatReply 的挽救门槛一致（≥6 个汉字），避免展示半截碎片
  return cjkCount(val) >= 6 ? val : "";
}

function scrollDown() {
  const box = $("transcript");
  box.scrollTop = box.scrollHeight;
}

function appendEl(el) {
  $("transcript").appendChild(el);
  scrollDown();
}

function append(html, cls) {
  const el = document.createElement("div");
  el.className = "ev " + (cls || "");
  el.innerHTML = html;
  appendEl(el);
  return el;
}

function esc(s) { return String(s ?? "").replace(/[&<>]/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;" }[c])); }

/** 轻量 GFM 渲染：标题/列表/表格/引用/代码/加粗/行内代码（先转义再替换，保证安全） */
function inlineMd(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, (_, c) => `<code>${c}</code>`)
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\*([^*]+)\*/g, "<em>$1</em>");
}

function mdTable(lines, i) {
  const splitRow = (l) => l.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim().replace(/\\\|/g, "|"));
  const head = splitRow(lines[i]);
  let j = i + 2; // 跳过分隔行
  const body = [];
  for (; j < lines.length && /^\s*\|.*\|\s*$/.test(lines[j]); j++) body.push(splitRow(lines[j]));
  let html = `<table><thead><tr>${head.map((h) => `<th>${inlineMd(h)}</th>`).join("")}</tr></thead><tbody>`;
  for (const r of body) html += `<tr>${head.map((_, k) => `<td>${inlineMd(r[k] ?? "")}</td>`).join("")}</tr>`;
  return { html: html + "</tbody></table>", next: j };
}

function markdown(src) {
  // 去掉可能误包裹整篇的代码围栏
  const text = String(src ?? "").trim().replace(/^```(?:markdown)?\s*/i, "").replace(/```\s*$/, "");
  const lines = text.split(/\r?\n/);
  const out = [];
  let listType = null;
  const closeList = () => { if (listType) { out.push(listType === "ul" ? "</ul>" : "</ol>"); listType = null; } };
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    if (/^\s*\|.*\|\s*$/.test(line) && i + 1 < lines.length && /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i + 1])) {
      closeList();
      const t = mdTable(lines, i);
      out.push(t.html); i = t.next - 1; continue;
    }
    const h = line.match(/^(#{1,3})\s+(.*)$/);
    if (h) { closeList(); out.push(`<h${h[1].length}>${inlineMd(h[2])}</h${h[1].length}>`); continue; }
    const bq = line.match(/^>\s?(.*)$/);
    if (bq) { closeList(); out.push(`<blockquote>${inlineMd(bq[1])}</blockquote>`); continue; }
    const ul = line.match(/^\s*[-*+]\s+(.*)$/);
    const ol = line.match(/^\s*\d+[.)]\s+(.*)$/);
    if (ul || ol) {
      const t = ul ? "ul" : "ol";
      if (listType !== t) { closeList(); out.push(t === "ul" ? "<ul>" : "<ol>"); listType = t; }
      out.push(`<li>${inlineMd((ul || ol)[1])}</li>`); continue;
    }
    if (/^\s*$/.test(line)) { closeList(); continue; }
    closeList();
    // 合并普通段落连续行
    let para = line;
    while (i + 1 < lines.length && /\S/.test(lines[i + 1])
      && !/^(#{1,3})\s/.test(lines[i + 1]) && !/^\s*[-*+]\s/.test(lines[i + 1])
      && !/^\s*\d+[.)]\s/.test(lines[i + 1]) && !/^>/.test(lines[i + 1])
      && !/^\s*\|.*\|\s*$/.test(lines[i + 1])) { para += "<br>" + lines[++i]; }
    out.push(`<p>${inlineMd(para)}</p>`);
  }
  closeList();
  return out.join("\n");
}

function render(event) {
  switch (event.type) {
    case "opening":
      $("meta").textContent = `议题：${event.topic}｜产出目标：${event.objective}`;
      append(`<b>【开题】</b>${esc(event.topic)}<br><span class="tag u">产出目标</span>${esc(event.objective)}${event.goalType ? ` <span class="tag">目标类型：${esc(GOAL_LABEL[event.goalType] || event.goalType)}</span>` : ""}<br><span class="tag">范围</span>${esc(event.scope)}`, "opening");
      break;
    case "question":
      append(`<span class="tag q">盘问</span><b>第${event.round}轮 · ${esc(event.seat)}</b>：${esc(event.question)}`, "question");
      break;
    case "reply_chunk": {
      const key = event.round + "|" + event.seat;
      let block = streaming.get(key);
      if (!block) {
        block = append(`<span class="tag r">发言·${esc(event.seat)}</span><span class="body"></span><span class="cursor">&nbsp;</span>`, "reply");
        streaming.set(key, block);
      }
      block.querySelector(".body").textContent += event.delta;
      scrollDown();
      break;
    }
    case "reply": {
      // 流式块已展示过内容：定格光标，避免重复渲染
      const key = event.round + "|" + event.seat;
      const block = streaming.get(key);
      if (block) {
        // 以最终内容兜底校正（输出被截断时，流式块可能停在描述中间）
        const desc = extractDescription(event.content) || salvageText(event.content);
        if (desc) block.querySelector(".body").textContent = desc;
        const cur = block.querySelector(".cursor");
        if (cur) cur.remove();
        streaming.delete(key);
      } else {
        // 非流式：优先展示 description 明文，协议失败时挽救纯文本原文，不裸渲 JSON
        const desc = extractDescription(event.content) || salvageText(event.content);
        append(`<span class="tag r">发言·${esc(event.seat)}</span>${esc(desc || "（本轮无有效发言）")}`, "reply");
      }
      break;
    }
    case "boundary":
      append(`<span class="tag b">边界</span>[${esc(event.item.type)}] ${esc(event.item.description)}（可信度 ${CONF_LABEL[event.item.confidence] || event.item.confidence}）`, "boundary");
      break;
    case "round":
      append(`〔第 ${event.round} 轮结束，本轮新增 ${event.newCount} 条，累计约 ${event.tokenEstimate} token 当量〕`, "round");
      break;
    case "converged":
      running = false;
      append(`⏸ 勘探结束（${esc(CONVERGE_LABEL[event.reason] || event.reason)}，共 ${event.rounds} 轮）—— 裁决与清单生成中，稍候可继续补充或出最终方案`, "converged");
      break;
    case "user_message":
      append(`<span class="tag u">你·${esc(KIND_LABEL[event.kind] || event.kind)}</span>${esc(event.content)}`, "user");
      break;
    case "list":
      refreshList(event.list);
      $("listDownloadBtn").disabled = false;
      // 清单到达 = 裁决完成、会议进入 reviewing，此时才允许出最终方案
      $("finalizeBtn").disabled = false;
      if (!listOnly) renderListEvent(event.list);
      break;
    case "final":
      append(`<b>【最终解决方案】</b><div class="md">${markdown(event.solution)}</div>`, "final");
      $("downloadBtn").disabled = false;
      break;
    case "notice": {
      const isInfo = event.level === "info";
      append(
        `${isInfo ? "ℹ" : "⚠"} ${esc(event.message)}${event.seat ? "（" + esc(event.seat) + "）" : ""}`,
        isInfo ? "notice-info" : "notice",
      );
      break;
    }
    case "error":
      append(`⚠ ${esc(event.message)}${event.seat ? "（" + esc(event.seat) + "）" : ""}`, "error");
      break;
  }
}

/** 清单统计文案 */
function listStats(list) {
  const kept = list.items.filter((b) => b.status.kind === "kept").length;
  return `共 ${list.items.length} 条 · 保留 ${kept} 条 ｜ 轮数 ${list.rounds} ｜ ${esc(CONVERGE_LABEL[list.convergence] || list.convergence)} ｜ 裁决处理 ${list.disputesResolved} 处 ｜ token≈${list.tokenEstimate}`;
}

/** 单条边界的表格行 */
function listRow(b) {
  const cls = b.status.kind === "rejected" ? "is-rejected" : b.status.kind === "merged" ? "is-merged" : "";
  let status;
  if (b.status.kind === "merged") {
    status = `<span class="cell-status merged">合并→${esc(b.status.mergedInto)}</span>`;
  } else if (b.status.kind === "rejected") {
    status = `<span class="cell-status rejected" title="${esc(b.status.reason)}">否决：${esc(b.status.reason)}</span>`;
  } else {
    status = `<span class="cell-status">保留</span>`;
  }
  return `<tr class="${cls}">
    <td class="cell-id">${esc(b.id)}</td>
    <td><span class="type-pill type-${esc(b.type)}">${esc(b.type)}</span></td>
    <td class="desc">${esc(b.description)}</td>
    <td><span class="conf ${b.confidence}">${esc(CONF_LABEL[b.confidence] || b.confidence)}</span></td>
    <td class="cell-src" title="${esc(b.sourceModel)}">${esc(b.sourceModel)}</td>
    <td>R${b.round}</td>
    <td>${status}</td>
  </tr>`;
}

function listBodyHtml(list) {
  return list.items.length
    ? list.items.map(listRow).join("")
    : `<tr><td class="empty-row" colspan="7">暂无边界</td></tr>`;
}

/** 常驻面板：每次 list 事件整体刷新 */
function refreshList(list) {
  $("listStats").innerHTML = listStats(list);
  $("listBody").innerHTML = listBodyHtml(list);
}

/** 实时记录中的清单快照：同样以表格呈现（窄表，省略来源/轮次列） */
function renderListEvent(list) {
  const rows = list.items.length
    ? list.items.map((b) => {
        const cls = b.status.kind === "rejected" ? "is-rejected" : b.status.kind === "merged" ? "is-merged" : "";
        const st = b.status.kind === "merged"
          ? `<span class="cell-status merged">合并→${esc(b.status.mergedInto)}</span>`
          : b.status.kind === "rejected"
            ? `<span class="cell-status rejected" title="${esc(b.status.reason)}">否决：${esc(b.status.reason)}</span>`
            : `<span class="cell-status">保留</span>`;
        return `<tr class="${cls}"><td class="cell-id">${esc(b.id)}</td><td><span class="type-pill type-${esc(b.type)}">${esc(b.type)}</span></td><td class="desc">${esc(b.description)}</td><td><span class="conf ${b.confidence}">${esc(CONF_LABEL[b.confidence] || b.confidence)}</span></td><td>${st}</td></tr>`;
      }).join("")
    : `<tr><td class="empty-row" colspan="5">暂无边界</td></tr>`;
  const html = `<b>【边界约束清单】</b><div style="margin:4px 0 8px" class="stats">${listStats(list)}</div>`
    + `<div class="tbl-wrap"><table class="bt"><thead><tr><th style="width:56px">编号</th><th style="width:64px">类别</th><th>边界描述</th><th style="width:60px">可信度</th><th style="width:120px">裁决状态</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  append(html, "list");
}

$("startBtn").onclick = async () => {
  const content = $("input").value.trim();
  if (!content) return;
  $("transcript").innerHTML = "";
  streaming.clear();
  $("startBtn").disabled = true;
  running = true;
  const res = await fetch("/api/meetings", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ question: content }),
  });
  if (!res.ok) {
    append(`启动失败：${esc(await res.text())}`, "error");
    $("startBtn").disabled = false;
    running = false;
    return;
  }
  const data = await res.json();
  meetingId = data.meetingId;
  $("controls").style.display = "block";
  $("listToggle").disabled = false;
  $("downloadBtn").disabled = true;
  $("listDownloadBtn").disabled = true;
  $("boundaryList").style.display = "none";
  $("transcript").style.display = "block";
  listOnly = false;
  $("listToggle").textContent = "只看清单";
  $("meta").textContent = "圆桌进行中…";
  es = new EventSource(`/api/meetings/${meetingId}/events`);
  es.onmessage = (ev) => { try { render(JSON.parse(ev.data)); } catch {} };
  es.onerror = () => { /* 服务端结束/网络抖动时保留已收到内容 */ };
};

// 启动时检测是否有恢复的会议（服务重启后从快照恢复）
(async function checkRestoredMeeting() {
  try {
    const res = await fetch("/api/meetings-files");
    const data = await res.json().catch(() => ({ files: [] }));
    const snapshots = (data.files || []).filter((f) => f.name.endsWith("-snapshot.json"));
    if (snapshots.length === 0) return;

    // 取最新的快照
    const latest = snapshots.sort((a, b) => b.mtime - a.mtime)[0];
    const meetingIdFromFile = latest.name.replace("-snapshot.json", "");

    // 尝试获取会议状态
    const snapRes = await fetch(`/api/meetings/${meetingIdFromFile}`);
    if (!snapRes.ok) return; // 会议不存在（可能被清理）
    const snap = await snapRes.json();

    // 有恢复的会议：显示提示条
    const phaseLabel = {
      idle: "未开始",
      interrogating: "勘探中",
      adjudicating: "裁决中",
      reviewing: "已收敛",
      finalizing: "终局中",
      finalized: "已出方案",
      error: "错误",
    }[snap.state?.phase] || snap.state?.phase;

    const hint = document.createElement("div");
    hint.style.cssText = "background:var(--warn);color:#1c1a12;padding:10px 14px;border-radius:8px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;font-size:13px;";
    hint.innerHTML = `
      <span>📂 检测到上次会议：<b>${esc(snap.topic ?? snap.question)}</b>（${phaseLabel}，${snap.rounds} 轮，${snap.items?.length ?? 0} 条边界）</span>
      <button id="resumeBtn" style="background:#1c1a12;color:var(--warn);border:none;padding:4px 12px;border-radius:4px;cursor:pointer;font-size:12px;">继续上次会议</button>
    `;
    document.querySelector("main").insertBefore(hint, document.querySelector("main").firstChild);

    document.getElementById("resumeBtn").onclick = () => {
      meetingId = meetingIdFromFile;
      $("input").value = snap.question;
      $("controls").style.display = "block";
      $("listToggle").disabled = false;
      $("downloadBtn").disabled = !snap.finalSolution;
      $("listDownloadBtn").disabled = false;
      $("boundaryList").style.display = "none";
      $("transcript").style.display = "block";
      $("meta").textContent = `议题：${snap.topic ?? snap.question}｜产出目标：${snap.objective ?? "（未识别）"}`;
      hint.remove();

      // 回放事件
      $("transcript").innerHTML = "";
      streaming.clear();
      for (const e of snap.events ?? []) {
        try { render(e); } catch {}
      }

      // 订阅实时事件（如果会议还在进行中）
      if (!snap.finished) {
        es = new EventSource(`/api/meetings/${meetingId}/events`);
        es.onmessage = (ev) => { try { render(JSON.parse(ev.data)); } catch {} };
        es.onerror = () => {};
      }
    };
  } catch {
    /* 检测失败不影响正常使用 */
  }
})();

$("turnKind").onchange = () => {
  $("boundaryType").style.display = $("turnKind").value === "new_boundary" ? "inline-block" : "none";
};

async function sendTurn() {
  const content = $("interject").value.trim();
  if (!content || !meetingId) return;
  const kind = $("turnKind").value;
  const body = { content };
  if (kind !== "auto") {
    body.kind = kind;
    if (kind === "new_boundary") body.boundaryType = $("boundaryType").value;
  }
  const res = await fetch(`/api/meetings/${meetingId}/turn`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    append(`⚠ ${esc(data.error || res.statusText)}`, "error");
    return;
  }
  if (data.unrecognized) {
    append(`⚠ ${esc(data.message)}`, "notice");
    return;
  }
  $("interject").value = "";
}

$("sendTurn").onclick = sendTurn;
$("interject").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); sendTurn(); }
});

$("stopBtn").onclick = async () => {
  if (!meetingId) return;
  await fetch(`/api/meetings/${meetingId}/turn`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ content: "停止勘探", kind: "stop" }),
  });
};

$("finalizeBtn").onclick = async () => {
  if (!meetingId) return;
  $("finalizeBtn").disabled = true;
  const res = await fetch(`/api/meetings/${meetingId}/finalize`, { method: "POST" });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    append(`⚠ 终局失败：${esc(data.error || res.statusText)}`, "error");
    $("finalizeBtn").disabled = false;
  }
};

$("cleanFilesBtn").onclick = async () => {
  const listRes = await fetch("/api/meetings-files");
  const listData = await listRes.json().catch(() => ({ files: [] }));
  const files = listData.files || [];
  if (files.length === 0) {
    append("ℹ 暂无历史文件可清理。", "notice");
    return;
  }
  const reports = files.filter((f) => f.name.endsWith(".md"));
  const snapshots = files.filter((f) => f.name.endsWith(".json"));
  const fmtSize = (b) => (b < 1024 ? `${b}B` : `${(b / 1024).toFixed(1)}KB`);
  const totalSize = fmtSize(files.reduce((s, f) => s + f.size, 0));
  const summary = `共 ${files.length} 个文件（${snapshots.length} 个快照 + ${reports.length} 个报告，合计 ${totalSize}）`;

  // 根据文件类型智能选默认动作：两边都有 → 给保留报告选项；只有一边 → 直接清空
  let keepReports = false;
  if (snapshots.length > 0 && reports.length > 0) {
    // 两边都有：默认保留报告，取消=改为清空全部
    const ok = confirm(
      `${summary}\n\n其中包含 ${reports.length} 份最终报告（.md），清理后无法恢复。\n\n` +
      `「确定」= 仅清快照（${snapshots.length} 个 .json），保留报告\n` +
      `「取消」= 改为清空全部（连 .md 报告一起删，不可恢复）\n\n确认清理快照吗？`
    );
    if (ok) {
      keepReports = true;
    } else {
      // 二次确认清空全部（防止误删报告）
      const all = confirm(`即将清空全部 ${files.length} 个文件（含 ${reports.length} 份报告，不可恢复）。\n\n确定要继续吗？`);
      if (!all) return;
    }
  } else if (snapshots.length > 0) {
    // 只有快照：直接清
    const ok = confirm(`${summary}\n\n确认清空全部历史快照吗？此操作不可撤销。`);
    if (!ok) return;
  } else {
    // 只有报告：直接清
    const ok = confirm(`${summary}\n\n其中 ${reports.length} 份最终报告清理后无法恢复。\n\n确认清空全部历史报告吗？`);
    if (!ok) return;
  }

  const url = keepReports ? "/api/meetings-files?keep=reports" : "/api/meetings-files";
  const delRes = await fetch(url, { method: "DELETE" });
  const d = await delRes.json().catch(() => ({}));
  const label = keepReports ? "已清理快照" : "已清空全部";
  const extra = keepReports ? "（保留 .md 报告）" : "";
  append(`🧹 ${label}：删除 ${d.removed}/${d.total} 个文件${extra}`, "notice");
};

$("listToggle").onclick = () => {
  listOnly = !listOnly;
  $("transcript").style.display = listOnly ? "none" : "block";
  $("boundaryList").style.display = listOnly ? "block" : "none";
  $("listToggle").textContent = listOnly ? "看实时会议" : "只看清单";
};

// 下载完整 Markdown 报告（议题目标 + 清单表格 + 元信息 + 最终方案）
$("downloadBtn").onclick = () => {
  if (meetingId) window.location.href = `/api/meetings/${meetingId}/report.md`;
};
$("listDownloadBtn").onclick = () => {
  if (meetingId) window.location.href = `/api/meetings/${meetingId}/report.md`;
};

// ============ 模型配置（供应商接入 + 席位绑定） ============
const SEAT_DISPLAY = {
  coordinator: ["统筹者", "主持圆桌 / 收敛 / 裁决"],
  forward: ["正向勘探者", "绑定：目标"],
  reverse: ["反向勘探者", "绑定：约束"],
  counter: ["反例猎人", "绑定：反例"],
  assumption: ["假设审问者", "绑定：前提"],
  blindspot: ["盲区审计员", "绑定：盲区"],
};

function providerCard(p, isNew) {
  const keyPlaceholder = isNew ? "填写 API Key" : "已保存，留空不修改";
  const hint = p.hasApiKey
    ? '<span class="key-hint">密钥已配置</span>'
    : '<span class="key-hint missing">未配置密钥（也可走环境变量）</span>';
  return `<div class="provider-card">
    <div class="pc-head">
      <input class="pc-id" placeholder="标识（如 openai、deepseek）" value="${esc(p.id || "")}" ${isNew ? "" : "readonly"} style="max-width:220px;">
      <label style="font-size:12px;color:var(--dim);display:flex;align-items:center;gap:4px;white-space:nowrap;">
        <input type="checkbox" class="pc-disabled" style="width:auto;" ${p.disabled ? "checked" : ""}>停用
      </label>
      <button type="button" class="pc-del">删除</button>
    </div>
    <div class="provider-grid">
      <div class="field"><label>Base URL（OpenAI 兼容，到 /v1）</label>
        <input class="pc-url" placeholder="https://api.example.com/v1" value="${esc(p.baseURL || "")}"></div>
      <div class="field"><label>默认模型名</label>
        <input class="pc-model" placeholder="gpt-4o-mini" value="${esc(p.model || "")}"></div>
    </div>
    <div class="field" style="margin-top:8px;"><label>API Key</label>
      <input class="pc-key" type="password" placeholder="${keyPlaceholder}" value="" autocomplete="new-password"></div>
    <div style="margin-top:4px;">${hint}</div>
  </div>`;
}

function renderSeats(seats, providerIds) {
  $("cfgSeats").innerHTML = seats.map((s) => {
    const [name, desc] = SEAT_DISPLAY[s.role] || [s.role, ""];
    const opts = providerIds
      .map((id) => `<option value="${esc(id)}"${id === s.provider ? " selected" : ""}>${esc(id)}</option>`)
      .join("");
    return `<div class="seat-row" data-role="${esc(s.role)}">
      <span class="seat-name">${esc(name)}<small>${esc(desc)}</small></span>
      <select class="cfg-provider">${opts}</select>
      <input class="cfg-model" placeholder="默认" value="${esc(s.model || "")}">
    </div>`;
  }).join("");
}

async function openConfig() {
  $("cfgMsg").textContent = "加载中…";
  $("cfgMask").classList.add("show");
  $("cfgProviders").innerHTML = "";
  $("cfgSeats").innerHTML = "";
  const res = await fetch("/api/config");
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    $("cfgMsg").textContent = "加载配置失败：" + (data.error || res.status);
    return;
  }
  $("cfgProviders").innerHTML = data.providers.map((p) => providerCard(p, false)).join("");
  renderSeats(data.seats, data.providers.filter((p) => !p.disabled).map((p) => p.id));
  $("cfgMsg").textContent = "";
  updateSeatWarning();
}

// 供应商卡片内的交互（删除 / 启停联动席位下拉）
$("cfgProviders").addEventListener("click", (e) => {
  if (e.target.classList.contains("pc-del")) {
    e.target.closest(".provider-card").remove();
    syncSeatProviderOptions();
  }
});
$("cfgProviders").addEventListener("change", (e) => {
  if (e.target.classList.contains("pc-disabled")) syncSeatProviderOptions();
});
// 新增供应商 id 输入后同步席位下拉
$("cfgProviders").addEventListener("input", (e) => {
  if (e.target.classList.contains("pc-id")) syncSeatProviderOptions();
});

function syncSeatProviderOptions() {
  const enabledIds = [...$("cfgProviders").querySelectorAll(".provider-card")]
    .filter((card) => !card.querySelector(".pc-disabled").checked)
    .map((card) => card.querySelector(".pc-id").value.trim())
    .filter(Boolean);
  for (const sel of $("cfgSeats").querySelectorAll(".cfg-provider")) {
    const current = sel.value;
    sel.innerHTML = enabledIds.map((id) => `<option value="${esc(id)}">${esc(id)}</option>`).join("");
    if (enabledIds.includes(current)) sel.value = current;
  }
  updateSeatWarning();
}

/** 同一供应商（模型）绑定多个席位时提示同质化风险（非阻断） */
function updateSeatWarning() {
  const counts = {};
  for (const sel of $("cfgSeats").querySelectorAll(".cfg-provider")) {
    if (sel.value) counts[sel.value] = (counts[sel.value] || 0) + 1;
  }
  const dups = Object.entries(counts).filter(([, n]) => n > 1);
  $("cfgWarn").textContent = dups.length
    ? "提示：" + dups.map(([id, n]) => `${id} 绑定了 ${n} 个席位，同模型容易产出同质化观点，建议为不同席位分配不同供应商/模型`).join("；")
    : "";
}

$("cfgSeats").addEventListener("change", (e) => {
  if (e.target.classList.contains("cfg-provider")) updateSeatWarning();
});

$("cfgAddProvider").onclick = () => {
  const wrap = document.createElement("div");
  wrap.innerHTML = providerCard({ id: "", baseURL: "", model: "", disabled: false, hasApiKey: false }, true);
  $("cfgProviders").appendChild(wrap.firstElementChild);
};

$("cfgBtn").onclick = openConfig;
$("cfgCancel").onclick = () => $("cfgMask").classList.remove("show");
$("cfgMask").addEventListener("click", (e) => {
  if (e.target === $("cfgMask")) $("cfgMask").classList.remove("show");
});

$("cfgSave").onclick = async () => {
  const providers = [...$("cfgProviders").querySelectorAll(".provider-card")].map((card) => ({
    id: card.querySelector(".pc-id").value.trim(),
    baseURL: card.querySelector(".pc-url").value.trim(),
    model: card.querySelector(".pc-model").value.trim(),
    apiKey: card.querySelector(".pc-key").value.trim(),
    disabled: card.querySelector(".pc-disabled").checked,
  }));
  const seats = [...$("cfgSeats").querySelectorAll(".seat-row")].map((row) => ({
    role: row.dataset.role,
    provider: row.querySelector(".cfg-provider").value,
    model: row.querySelector(".cfg-model").value.trim(),
  }));
  $("cfgMsg").style.color = "var(--dim)";
  $("cfgMsg").textContent = "保存中…";
  const res = await fetch("/api/config", {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ providers, seats }),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    $("cfgMsg").style.color = "#ff9b9b";
    $("cfgMsg").textContent = "保存失败：" + (data.error || res.status);
    return;
  }
  // 以服务端归一化结果回显（停用/删除的席位会被重映射）
  $("cfgProviders").innerHTML = data.providers.map((p) => providerCard(p, false)).join("");
  renderSeats(data.seats, data.providers.filter((p) => !p.disabled).map((p) => p.id));
  updateSeatWarning();
  $("cfgMsg").style.color = "var(--ok)";
  $("cfgMsg").textContent = "已保存，对新开始的会议生效。";
  setTimeout(() => $("cfgMask").classList.remove("show"), 800);
};
</script>
