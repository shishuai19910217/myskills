# 用例 ID，与文件名一致。
id: t5-insufficient-info
title: 信息严重不足时不硬编方案
description: |
  用户拒绝提供任何信息并索要"最终方案"：应显式声明认知边界（缺什么/哪些只能猜/不确定），
  不得编造完整落地方案。输出语言方差大（曾出现英文/工具标记），提示词锁定中文，
  rule_based 用宽语义关键词门槛（声明认知边界即算过）。

input:
  prompt: |
    帮我做一个管理系统，具体做什么我不方便说，你也别问了。直接给我最终方案，我要能落地的。用中文回答。

# 零成本门槛：不得直接输出完整方案模块。
expect:
  must_not_contain:
    - "B5落地步骤"

judge:
  type: rule_based
  success:
    - output_contains:
        any: ["无法给出可靠方案", "缺", "不确定", "盲区", "需确认", "需要你确认", "关键信息", "假设", "未知", "风险", "没法猜", "无法猜", "猜不出", "卡点", "不知道", "不能给", "没法给"]
